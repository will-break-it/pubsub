# Corrected row floor N = 5 667, B = 256 — CIP-0201 "What remains to be
# measured" item 1. Candidate admission budget C = 16 from the serving-cap
# recipe (k = 10, mu = 0.2, A = 1 134): L = (1 - m~)(k(1-mu) + A/B) = 6.81,
# C = ceil(L + 3.5 sqrt L) = 16.
#
# Churn axis = honest downtime after topology formation. Reference cell is
# churn 0; the 2 % cell is the deployment bar (the 0.016 mu-margin), 5 % the
# churn reading of the same margin. Deep-tail resolution at delta = 1e-4 is
# not claimed by these cells, which establish no gross failure at the floor.
#
#   experiments --config configs/experiments/corrected-floors/floor-5667.toml --out results/corrected-floors/floor-5667/

model = "m4"
master_seed = 1300

[population]
size = 5667
adversarial_fraction = 0.2
topic = "t0"

[strategies.honest]
pick_count = 10
bucket_count = 256
accept_cap = 16
symmetric = true
fanout = "forward-to-relays"

[strategies.adversarial]
pick_count = 10
bucket_count = 256
accept_cap = 16
symmetric = true
fanout = "silent-relay"

[execution]
runs_per_experiment = 2000

[[axes]]
parameter = "churn"
values = [0.0, 0.02, 0.05]
