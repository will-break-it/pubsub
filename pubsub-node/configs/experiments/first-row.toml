# CIP-0201 appendix "What remains to be measured", item 5 — the first
# bucket-table row (population 2–40, gate off: B = 1, pick count 10).
#
# Two questions the row leaves open:
#   (a) at and below 11 nodes, is the topology effectively complete, so no
#       honest pair is left with a topology-induced isolation risk?
#   (b) at 12 / 20 / 30 / 40, what is the realised standing degree and the
#       isolation rate, against the finite-population prediction?
#
# Model m4 (the selected design): symmetric links, exact-RF uniform picks,
# pick count 10, no bucket (gate off). The size axis walks the row.
#
# Run (release binary):
#   experiments --config configs/experiments/first-row.toml --out results/first-row/

model = "m4"
master_seed = 1200

[population]
size = 11
adversarial_fraction = 0.2
topic = "t0"

[strategies.honest]
pick_count = 10
symmetric = true
fanout = "forward-to-relays"

[strategies.adversarial]
pick_count = 10
symmetric = true
fanout = "silent-relay"

[execution]
runs_per_experiment = 2000

[[axes]]
parameter = "size"
values = [5, 8, 11, 12, 20, 30, 40]
