# Tight-row floor N=321, B=16 (candidate bucket table) — gated coverage at
# the row's least-headroom point: pick count 10, symmetric M4, no admission
# cap. Admission-budget validation is a separate row (CIP item 1).
#
#   experiments --config configs/experiments/tight-rows/floor-321.toml --out results/tight-rows/floor-321/

model = "m4"
master_seed = 1213

[population]
size = 321
adversarial_fraction = 0.2
topic = "t0"

[strategies.honest]
pick_count = 10
bucket_count = 16
symmetric = true
fanout = "forward-to-relays"

[strategies.adversarial]
pick_count = 10
bucket_count = 16
symmetric = true
fanout = "silent-relay"

[execution]
runs_per_experiment = 2000
